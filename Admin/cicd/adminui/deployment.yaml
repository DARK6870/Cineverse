apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-ui
  namespace: cineverse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-ui
  template:
    metadata:
      labels:
        app: admin-ui
    spec:
      containers:
        - name: admin-ui
          image: adminui:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 4200
          envFrom:
            - configMapRef:
                name: cineverse-config
---
apiVersion: v1
kind: Service
metadata:
  name: admin-ui
  namespace: cineverse
spec:
  selector:
    app: admin-ui
  ports:
    - port: 4200
      targetPort: 4200
