<div class="page-container">
  <div class="main-container">
    <app-movie-details-card [movie]="movie()!" [showTrailer]="true"/>

    <!-- Screenings -->
    <div class="grid grid-cols-2 md:grid-cols-3 gap-6 mt-5 mb-5">
      @for (screening of screenings(); track screening.id)
      {
        <div class="feature text-center p-4 bg-white rounded-lg shadow-md hover:shadow-lg transition-shadow">
          <h3 class="text-xl font-bold text-gray-800">{{ movie()?.title }}</h3>
          <p class="text-gray-700">
            {{ getDayName(screening.date) }}, {{ getFriendlyDate(screening.date) }} <br>

            <span class="mt-2 mb-2 inline-block bg-gray-600 text-gray-100 text-xs font-medium px-2 py-1 rounded-full">
              <b>{{ screening.startTime.slice(0, -3) }} - {{ screening.endTime.slice(0, -3) }}</b>
            </span>
          </p>
          <p-button
            severity="primary"
            label="Buy Ticket"
            icon="pi pi-ticket"
            styleClass="p-button-sm w-full mt-2"
            [routerLink]="'/book/' + screening.id"
          ></p-button>
        </div>
      }
    </div>

  </div>
</div>
