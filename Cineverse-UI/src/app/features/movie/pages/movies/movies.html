<div class="page-container">
  <div class="main-container">
    <!-- Banner -->
    <div class="banner-container mb-8 rounded-lg overflow-hidden shadow-lg">
      <div class="relative">
        <img class="w-full h-auto" src="https://media.formula1.com/image/upload/t_16by9Centre/c_lfill,w_3392/q_auto/v1740000000/fom-website/2025/F1%20movie/f1_movie_poster16x9%20(1).webp" alt="banner">
        <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black to-transparent p-4">
          <h1 class="text-4xl font-bold text-white absolute bottom-5">Now showing</h1>
        </div>
      </div>
    </div>

    <!-- Filtering / Search -->
    <div class="flex items-center gap-1 mt-2 mb-5">
      <div class="search">
        <p-iconfield>
          <p-inputicon class="pi pi-search" />
          <input type="text" pInputText placeholder="Search" />
        </p-iconfield>
      </div>

      <div class="filters">
        <p-button severity="secondary">
          <i class="pi pi-filter-fill"></i>
        </p-button>
      </div>
    </div>

    <!-- Movies -->
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 mb-20">
      @for (movie of movies(); track movie.id) {
        <app-movie-card [movie]='movie' [isShowingNow]=true></app-movie-card>
      }
    </div>

  </div>
</div>
