<div class="page-container p-4 sm:p-8">
  <div class="main-container max-w-xl min-w-[400px] mx-auto">

    <div class="card p-8 shadow-xl rounded-2xl bg-white">
      <h2 class="text-3xl font-semibold mb-5 text-center">Create Support Ticket</h2>
      <form [formGroup]="supportForm" (ngSubmit)="onSubmit()" class="mt-3 flex flex-col gap-6">

        <div class="flex flex-col gap-1">
          <label for="firstName" class="font-medium">First Name</label>
          <input pInputText id="firstName" placeholder="Enter your first name" formControlName="firstName" [invalid]="isInvalid('firstName')" />
          @if (isInvalid('firstName')) {
            <p-message severity="error" size="small" variant="simple">First name is required</p-message>
          }
        </div>

        <div class="flex flex-col gap-1">
          <label for="lastName" class="font-medium">Last Name</label>
          <input pInputText id="lastName" placeholder="Enter your last name" formControlName="lastName" [invalid]="isInvalid('lastName')" />
          @if (isInvalid('lastName')) {
            <p-message severity="error" size="small" variant="simple">Last name is required</p-message>
          }
        </div>

        <div class="flex flex-col gap-1">
          <label for="email" class="font-medium">Email</label>
          <input pInputText id="email" placeholder="Enter your email" formControlName="email" [invalid]="isInvalid('email')" />
          @if (isInvalid('email')) {
            <p-message severity="error" size="small" variant="simple">Invalid email</p-message>
          }
        </div>

        <div class="flex flex-col gap-1">
          <label for="subject" class="font-medium">Subject</label>
          <input pInputText id="subject" placeholder="Enter subject" formControlName="subject" [invalid]="isInvalid('subject')" />
          @if (isInvalid('subject')) {
            <p-message severity="error" size="small" variant="simple">Subject is required</p-message>
          }
        </div>

        <div class="flex flex-col gap-1">
          <label for="description" class="font-medium">Description</label>
          <textarea pInputTextarea id="description" rows="4" placeholder="Describe your issue" formControlName="description" [invalid]="isInvalid('description')"></textarea>
          @if (isInvalid('description')) {
            <p-message severity="error" size="small" variant="simple">Description is required</p-message>
          }
        </div>

        <button pButton severity="primary" type="submit" class="mt-4">
          <span pButtonLabel>Submit</span>
        </button>
      </form>
    </div>
  </div>
</div>
