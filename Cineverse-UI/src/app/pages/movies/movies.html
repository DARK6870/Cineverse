<div class="page-container">
  <div class="main-container">
    <!-- Banner -->
    <div class="banner-container mb-8 rounded-lg overflow-hidden shadow-lg">
      <div class="relative">
        <img class="w-full h-auto" src="https://media.formula1.com/image/upload/t_16by9Centre/c_lfill,w_3392/q_auto/v1740000000/fom-website/2025/F1%20movie/f1_movie_poster16x9%20(1).webp" alt="banner">
        <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black to-transparent p-4">
          <h1 class="text-4xl font-bold text-white absolute bottom-5">Now showing</h1>
        </div>
      </div>
    </div>

    <!-- Filtering / Search -->
    <div class="flex items-center gap-1 mt-2 mb-2">
      <h2 class="text-2xl font-bold mb-6 text-gray-800">Now showing</h2>

      <div class="search ml-auto">
        <p-iconfield>
          <p-inputicon class="pi pi-search" />
          <input type="text" pInputText placeholder="Search" />
        </p-iconfield>
      </div>

      <div class="filters">
        <p-button severity="secondary">
          <i class="pi pi-filter-fill"></i>
        </p-button>
      </div>
    </div>

    <!-- Movies -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      @for (movie of movies(); track movie.id) {
        <div class="movie-card bg-white rounded-lg shadow-md overflow-hidden flex flex-col">
          <div class="poster-container w-full overflow-hidden">
            <img
              [src]="movie.posterUrl"
              [alt]="movie.title + ' poster'"
              loading="lazy"
              class="h-full w-full object-cover"
            />
          </div>
          <div class="p-3 flex flex-col flex-1">
            <h3 class="font-bold text-lg mb-1">{{ movie.title }}</h3>
            <p class="text-gray-600 text-sm mb-2">
              Genre: <strong>{{ movie.genre }}</strong>
            </p>
            <div class="mt-auto">
              <p-button
                severity="contrast"
                label="Buy Ticket"
                icon="pi pi-ticket"
                styleClass="p-button-sm w-full mt-2"
                [routerLink]="'/movies-details/' + movie.id"
              ></p-button>
            </div>
          </div>
        </div>
      }
    </div>

  </div>
</div>
