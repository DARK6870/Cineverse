<div class="page-container p-4 sm:p-8">
  <div class="main-container min-w-[400px] mx-auto">
    <div class="card p-8 shadow-xl rounded-2xl bg-white">

      <div class="flex justify-center mb-2">
        <img class="cineverse-logo" src="/icons/logo.svg" alt="Cineverse Logo">
      </div>

      <h1 class="text-2xl font-bold text-center">Confirm email</h1>
      <p class="text-center mb-10 text-gray-600">
        To use our website without restrictions, you need to confirm your email address
      </p>

      <form [formGroup]="confirmEmailForm" (ngSubmit)="onSubmit()" class="mt-3 flex flex-col gap-6">

        <!-- Verification Code -->
        <div class="flex flex-col items-center gap-4">
          <!-- Label -->
          <label for="verificationCode" class="font-medium flex items-center gap-2 justify-center">
            <i class="pi pi-lock"></i>
            Verification code
          </label>

          <!-- InputOtp -->
          <p-inputOtp
            id="verificationCode"
            formControlName="verificationCode"
            [length]="5"
            [integerOnly]="true"
            [invalid]="isInvalid('verificationCode')"
            class="justify-center"
            size="large"
          ></p-inputOtp>

          <!-- Error message -->
          @if (getErrorMessageByName('verificationCode')) {
            <p-message severity="error" size="small" variant="simple" class="text-center">
              {{ getErrorMessageByName('verificationCode') }}
            </p-message>
          }
        </div>


        <!-- Buttons -->
        <div class="flex gap-4 mt-4">
          <button pButton severity="contrast" type="submit" class="flex-1">
            <span pButtonLabel>Confirm Email</span>
          </button>

          <button
            class="flex-1"
            type="button"
            pButton
            (click)="resendVerificationCode()"
            [class.pointer-events-none]="!canResend"
            [class.opacity-50]="!canResend"
            style="cursor: pointer;"
          >
          <span pButtonLabel>
            @if (canResend) {
              Send code
            } @else {
              {{ countDown }}s
            }</span>
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
