apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-stack
  namespace: cineverse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-stack
  template:
    metadata:
      labels:
        app: redis-stack
    spec:
      containers:
        - name: redis-stack
          image: redis/redis-stack:latest
          ports:
            - containerPort: 6379
              name: redis
            - containerPort: 8001
              name: redis-ui
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: redis-stack
  namespace: cineverse
spec:
  selector:
    app: redis-stack
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
    - name: redis-ui
      port: 8001
      targetPort: 8001

---
apiVersion: v1
kind: Service
metadata:
  name: redis-ui
  namespace: cineverse
spec:
  selector:
    app: redis-stack
  ports:
    - port: 8001
      targetPort: 8001