apiVersion: apps/v1
kind: Deployment
metadata:
  name: apigateway
  namespace: cineverse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apigateway
  template:
    metadata:
      labels:
        app: apigateway
    spec:
      containers:
        - name: apigateway
          image: apigateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: apigateway
  namespace: cineverse
spec:
  selector:
    app: apigateway
  ports:
    - port: 8080
      targetPort: 8080
  type: NodePort
