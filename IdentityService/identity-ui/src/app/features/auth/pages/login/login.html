<div class="page-container p-4 sm:p-8">
  <div class="main-container mx-auto">
    <div class="card p-8 shadow-xl rounded-2xl bg-white">

      <div class="flex justify-center mb-2">
        <img class="cineverse-logo" src="/icons/logo.svg" alt="Cineverse Logo">
      </div>

      <h1 class="text-2xl font-bold mb-10 text-center">Login into account</h1>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="mt-3 flex flex-col gap-6">

        <!-- Email -->
        <div class="flex flex-col gap-1">
          <label for="email" class="font-medium flex items-center gap-2">
            <i class="pi pi-envelope"></i>
            Email
          </label>

          <input
            pInputText
            id="email"
            placeholder="Enter your email"
            formControlName="email"
            autocomplete="username"
            [invalid]="isInvalid('email')"
          />
          @if (getErrorMessageByName('email')) {
            <p-message severity="error" size="small" variant="simple">
              {{ getErrorMessageByName('email') }}
            </p-message>
          }
        </div>

        <!-- Password -->
        <div class="flex flex-col gap-1">
          <label for="password" class="font-medium flex items-center gap-2">
            <i class="pi pi-lock"></i>
            Password
          </label>
          <input
            pInputText
            type="password"
            id="password"
            placeholder="Enter your password"
            formControlName="password"
            [invalid]="isInvalid('password')"
          />
          @if (getErrorMessageByName('password')) {
            <p-message severity="error" size="small" variant="simple">
              {{ getErrorMessageByName('password') }}
            </p-message>
          }
        </div>

        <!-- Submit -->
        <button pButton severity="contrast" type="submit" class="mt-4">
          <span pButtonLabel>Login</span>
        </button>

        <!-- Divider -->
        <div class="flex items-center w-full my-2">
          <div class="flex-1 h-px bg-gray-200"></div>
          <span class="px-4 text-sm text-gray-400 font-medium tracking-wide">
            OR
          </span>
          <div class="flex-1 h-px bg-gray-200"></div>
        </div>

        <!-- External Login -->
        <div class="flex gap-4 w-full">

          <!-- Google -->
          <a
            href="/api/identity/account/login/google"
            class="cursor-pointer flex-1 flex items-center justify-center gap-3
           py-3 px-4 rounded-lg
           bg-white border border-gray-200
           text-gray-700 font-medium
           shadow-sm hover:shadow-md
           hover:bg-gray-50
           active:scale-[0.98]
           transition-all duration-200">
            <i class="pi pi-google"></i> Google
          </a>

          <!-- GitHub -->
          <a
            href="/api/identity/account/login/github"
            class="cursor-pointer flex-1 flex items-center justify-center gap-3
           py-3 px-4 rounded-lg
           bg-black text-white font-medium
           shadow-sm hover:shadow-md
           hover:bg-gray-900
           active:scale-[0.98]
           transition-all duration-200">
            <i class="pi pi-github"></i> GitHub
          </a>

        </div>

        <div class="flex flex-col gap-1 text-sm text-gray-700 mt-5">
          <p>
            Don't have an account?
            <a class="text-blue-600 hover:underline font-medium" routerLink="/register">
              Register a new account
            </a>
          </p>

          <p class="mt-1">
            <a class="text-blue-600 hover:underline font-medium" routerLink="/restore-password">
              Forgot Password?
            </a>
          </p>
        </div>

      </form>
    </div>
  </div>
</div>
