<div class="page-container p-4 sm:p-8">
  <div class="main-container mx-auto">
    <div class="card p-8 shadow-xl rounded-2xl bg-white">

      <div class="flex justify-center mb-2">
        <img class="cineverse-logo" src="/icons/logo.svg" alt="Cineverse Logo">
      </div>

      <h1 class="text-2xl font-bold text-center">Restore Password</h1>
      <p class="text-center mb-10 text-gray-600">
        <small>You will receive an email with a link to restore your password</small>
      </p>

      <form [formGroup]="restorePasswordForm" (ngSubmit)="onSubmit()" class="mt-3 flex flex-col gap-6">

        <!-- Email -->
        <div class="flex flex-col gap-1">
          <label for="email" class="font-medium flex items-center gap-2">
            <i class="pi pi-envelope"></i>
            Email
          </label>

          <input
            pInputText
            id="email"
            placeholder="Enter your email"
            formControlName="email"
            [invalid]="isInvalid('email')"
          />
          @if (getErrorMessageByName('email')) {
            <p-message severity="error" size="small" variant="simple">
              {{ getErrorMessageByName('email') }}
            </p-message>
          }
        </div>

        <!-- Submit -->
        <button [disabled]="sent()" pButton severity="contrast" type="submit" class="mt-4">
          <span pButtonLabel>Send Restore Email Message</span>
        </button>

      </form>
    </div>
  </div>
</div>
