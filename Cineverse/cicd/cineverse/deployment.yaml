apiVersion: apps/v1
kind: Deployment
metadata:
  name: cineverse-api
  namespace: cineverse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cineverse-api
  template:
    metadata:
      labels:
        app: cineverse-api
    spec:
      containers:
        - name: cineverse-api
          image: cineverse:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7400
          envFrom:
            - configMapRef:
                name: cineverse-config
---
apiVersion: v1
kind: Service
metadata:
  name: cineverse-api
  namespace: cineverse
spec:
  selector:
    app: cineverse-api
  ports:
    - port: 7400
      targetPort: 7400
  type: NodePort
