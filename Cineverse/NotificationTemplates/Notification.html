<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .message-body {
            background-color: #f4f4f4;
            padding: 15px;
            margin: 0 auto;
        }

        .message-header {
            width: 100%;
            height: 8px;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-wrapper {
            display: table;
            margin: 0 auto;
        }

        .cineverse-logo {
            width: 270px;
            height: 80px;
            background-color: #000000;
            display: table-cell;
            vertical-align: middle;
            text-align: center;
        }

        .cineverse-text {
            font-family: 'Segoe UI', sans-serif;
            font-size: 40px;
            color: #ffffff;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .container {
            padding: 20px;
            display: table;
            margin: 0 auto;
            min-height: 50vh;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }

        .message-container {
            display: inline-block;
            background: white;
            padding: 20px;
            border-radius: 3px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            min-width: 50%;
            max-width: 600px;
            min-height: 300px;
        }

        .content {
            padding: 0 20px 20px 20px;
            font-size: 16px;
            color: #333;
        }

        .footer {
            text-align: center;
            padding: 10px;
            font-size: 12px;
            color: #777;
        }
        
        small{
            color: #777;
        }

        a {
            color: #007bff;
            text-decoration: none;
        }

        @media (max-width: 500px) {
            .cineverse-logo {
                width: 180px;
                height: 54px;
            }
            .cineverse-text {
                font-size: 26px;
                letter-spacing: 1.5px;
            }
            
            .message-container {
                min-width: 90%;
                padding: 10px;
            }
            
            .container{
                padding: 10px;
            }

            .content {
                font-size: 14px;
            }

            .footer {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
<div class="message-header"></div>
<div class="message-body">
    <div class="logo-wrapper">
        <div class="cineverse-logo">
            <span class="cineverse-text">CINEVERSE</span>
        </div>
    </div>

    <div class="container">
        <div class="message-container">
            <div class="content">
                {Content}
            </div>
        </div>
    </div>

    <div class="footer">
        &copy; 2025 Cineverse Notifications. All rights reserved.
    </div>
</div>
</body>
</html>
