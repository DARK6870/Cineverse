<div class="page-container">
  <div class="main-container">
    <app-movie-details-card [movie]="movie()!" [showTrailer]="true"/>

    <!-- Screenings -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 mt-5 mb-5">
      @for (screening of screenings(); track screening.id)
      {
        <div class="bg-white rounded-[20px] px-4 pt-4 pb-3 shadow-[0_12px_28px_rgba(18,24,40,0.12)] border border-[#ece9e3] flex flex-col gap-3 transition-transform duration-150 hover:-translate-y-0.5 hover:shadow-[0_16px_36px_rgba(18,24,40,0.16)]">
          <div class="flex items-center justify-between gap-3">
            <div class="inline-flex items-center gap-2 px-3.5 py-2 rounded-full bg-[#f3eee7] text-[#5a5246] text-[13px] font-semibold border border-[#e6dfd6] whitespace-nowrap">
              <i class="pi pi-calendar text-sm"></i>
              <span>{{ getDayName(screening.date) }}</span>
            </div>
            <div class="inline-flex items-center gap-2 px-3.5 py-2 rounded-full bg-[#f6f1ea] text-[#5a5246] text-[13px] font-semibold border border-[#e6dfd6] whitespace-nowrap">
              <span>{{ screening.startTime.slice(0, -3) }} - {{ screening.endTime.slice(0, -3) }}</span>
            </div>
          </div>

          <div class="flex flex-col gap-1 mb-5">
            <h3 class="text-[22px] font-bold text-[#2a2a2a] leading-tight m-0">{{ movie()?.title }}</h3>
            <p class="text-sm text-[#6c6c6c] m-0">{{ getFriendlyDate(screening.date) }}</p>
          </div>

          <p-button
            severity="contrast"
            label="Book Ticket"
            icon="pi pi-ticket"
            styleClass="p-button-sm w-full rounded-xl font-semibold bg-[#2f3a4d] border-[#2f3a4d] hover:bg-[#273244] hover:border-[#273244]"
            [routerLink]="'/book/' + screening.id"
          ></p-button>
        </div>
      }
    </div>

  </div>
</div>
