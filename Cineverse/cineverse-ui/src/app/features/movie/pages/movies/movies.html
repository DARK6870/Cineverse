<div class="page-container">
  <div class="main-container">
    <!-- Banner -->
    <div class="banner-container mb-8 rounded-lg overflow-hidden shadow-lg">
      <div class="relative">
        <img class="w-full h-auto"
             src="https://media.formula1.com/image/upload/t_16by9Centre/c_lfill,w_3392/q_auto/v1740000000/fom-website/2025/F1%20movie/f1_movie_poster16x9%20(1).webp"
             alt="banner">
        <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black to-transparent p-4">
          <h1 class="text-4xl font-bold text-white absolute bottom-5">Now in Cinemas</h1>
        </div>
      </div>
    </div>

    <!-- Movies -->
    <h1 class="text-2xl md:text-3xl font-bold text-gray-900 mt-5 mb-4">Now Showing</h1>

    @if (movies().length > 0) {
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 mb-20">
        @for (movie of movies(); track movie.id) {
          <app-movie-card [movie]='movie' [isShowingNow]=true></app-movie-card>
        }
      </div>
    } @else {
      <div class="text-center mt-20 mb-100">
        <h1 class="text-4xl md:text-5xl font-bold text-gray-900"> No movies available right now </h1>
      </div>
    }

  </div>
</div>
