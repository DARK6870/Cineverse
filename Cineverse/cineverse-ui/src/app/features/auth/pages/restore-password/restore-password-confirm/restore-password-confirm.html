<div class="page-container p-4 sm:p-8">
  <div class="main-container mx-auto">

    <p-confirmDialog></p-confirmDialog>

    <div class="card p-8 shadow-xl rounded-2xl bg-white">

      <div class="flex justify-center mb-2">
        <img class="cineverse-logo" src="/icons/logo.svg" alt="Cineverse Logo">
      </div>

      <h1 class="text-2xl font-bold mb-10 text-center">Change Password</h1>

      <form [formGroup]="restorePasswordForm" (ngSubmit)="onSubmit()" class="mt-3 flex flex-col gap-6">

        <!-- New Password -->
        <div class="flex flex-col gap-1">
          <label for="password" class="font-medium flex items-center gap-2">
            <i class="pi pi-lock"></i>
            New password
          </label>
          <input
            pInputText
            type="password"
            id="password"
            placeholder="Enter new password"
            formControlName="password"
            [invalid]="isInvalid('password')"
          />
          @if (getErrorMessageByName('password')) {
            <p-message severity="error" size="small" variant="simple">
              {{ getErrorMessageByName('password') }}
            </p-message>
          }
        </div>

        <!-- Confirm New Password -->
        <div class="flex flex-col gap-1">
          <label for="confirmPassword" class="font-medium flex items-center gap-2">
            <i class="pi pi-lock"></i>
            Confirm new password
          </label>
          <input
            pInputText
            type="password"
            id="confirmPassword"
            placeholder="Enter new password again"
            formControlName="confirmPassword"
            [invalid]="isInvalid('confirmPassword')"
          />
          @if (getErrorMessageByName('confirmPassword')) {
            <p-message severity="error" size="small" variant="simple">
              {{ getErrorMessageByName('confirmPassword') }}
            </p-message>
          }
        </div>

        <!-- Submit -->
        <button pButton severity="contrast" type="submit" class="mt-4">
          <span pButtonLabel>Submit</span>
        </button>

      </form>
    </div>
  </div>
</div>
