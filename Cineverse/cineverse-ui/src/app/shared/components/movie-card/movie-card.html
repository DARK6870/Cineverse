<div class="movie-card rounded-lg shadow-md overflow-hidden flex flex-col transition hover:shadow-lg">
  <div class="poster-container w-full aspect-[2/3] overflow-hidden">
    <img
      [src]="movie.posterUrl"
      [alt]="movie.title + ' poster'"
      loading="lazy"
      class="h-full w-full object-cover cursor-pointer"
      [routerLink]="'/movies-details/' + movie.id"
    />
  </div>
</div>
