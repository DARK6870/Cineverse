<!-- Trailer -->
@if (showTrailer) {
  <div class="video-container mb-8" style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden;">
    <iframe
      width="100%"
      height="100%"
      [src]="trailerUrlSafe"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>
}

<!-- Movie Details -->
<div class="bg-gray-50 rounded-2xl p-6 flex flex-col md:flex-row gap-6 md:gap-10 mb-8 shadow-sm items-center">

  <!-- Poster -->
  <div class="flex-shrink-0 poster-container relative rounded-xl overflow-hidden flex justify-center">
    <img
      [src]="movie.posterUrl"
      alt="Poster"
      class="w-auto max-w-full h-auto max-h-[500px] rounded-xl shadow-md transition-transform duration-300"
    />
  </div>


  <!-- Details -->
  <div class="flex-1 flex flex-col justify-between">

    <!-- Title -->
    <h1 class="text-2xl md:text-3xl font-bold text-gray-800 mb-3">
      {{ movie.title }}
    </h1>

    <!-- Info Table -->
    <div class="bg-gray-200 rounded-xl p-4 md:p-6 shadow-sm border border-gray-100 mb-4">
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 text-sm text-gray-700">
        <div>
          <span class="font-semibold">Genre:</span>
          <p class="text-gray-500">{{ movie.genre || '-' }}</p>
        </div>
        <div>
          <span class="font-semibold">Audio:</span>
          <p class="text-gray-600">Dolby Atmos</p>
        </div>
        <div>
          <span class="font-semibold">Duration:</span>
          <p class="text-gray-600">{{ movie.duration || '-' }}</p>
        </div>
        <div>
          <span class="font-semibold">Release Date:</span>
          <p class="text-gray-600">{{ formatDate(movie.releaseDate) || '-' }}</p>
        </div>
        <div>
          <span class="font-semibold">Format:</span>
          <p class="text-gray-600">3D</p>
        </div>
        <div>
          <span class="font-semibold">Sound:</span>
          <p class="text-gray-600">Surround Sound</p>
        </div>
      </div>
    </div>

    <!-- Description -->
    <div class="text-gray-700 leading-relaxed text-sm md:text-base">
      <markdown [data]="movie.description"></markdown>
    </div>

  </div>
</div>
